
name: Swift CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: Build
        run: |
        xcodebuild \
      -project MySwiftyRepo.xcodeproj \
      -scheme MySwiftyRepo \
      -destination 'platform=macOS' \
      CODE_SIGNING_ALLOWED=NO \
      build

